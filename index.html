<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woodshop Manager</title>
<style>
:root{--green:#244b3c;--green2:#386b53;--cream:#f5f2e9;--paper:#fffdf8;--ink:#202923;--muted:#69756d;--line:#d8ded5;--red:#a33b32}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{background:var(--green);color:white;padding:22px max(16px,calc((100% - 1000px)/2));}
header h1{margin:0;font-size:1.55rem}header p{margin:4px 0 0;color:#e2ebe4}
main{max-width:1000px;margin:auto;padding:16px}
nav{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}
nav button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:10px 15px;color:var(--ink);font-weight:650}
nav button.active{background:var(--green);color:white;border-color:var(--green)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #20382a0b}
h2{font-size:1.25rem;margin:0 0 12px}h3{margin:0 0 8px;font-size:1.05rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
button,.button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;font:inherit;font-weight:650;background:var(--green);color:white}
button.secondary{background:#e8eee8;color:var(--green)}button.danger{background:#f8e8e5;color:var(--red)}
button.small{padding:7px 10px;font-size:.9rem}
input,select,textarea{width:100%;border:1px solid #bac7bc;border-radius:9px;background:white;padding:10px;font:inherit;color:var(--ink)}
label{display:block;font-size:.9rem;font-weight:650;margin-bottom:5px}
.field{margin-bottom:12px;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:13px}main{padding:12px}}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.85rem;color:var(--muted)}.tablewrap{overflow-x:auto}
.itemlist{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.itemtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.itemname{font-weight:750}.muted{color:var(--muted);font-size:.9rem}.stock{font-size:1.05rem;font-weight:800;color:var(--green);margin:7px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.empty{padding:18px;text-align:center;color:var(--muted)}.notice{padding:10px 12px;background:#edf4ed;border-radius:10px;color:#244b3c;margin:10px 0}.hidden{display:none!important}.pill{display:inline-block;border-radius:99px;background:#edf4ed;padding:3px 8px;font-size:.82rem;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:12px;background:#edf2eb;border-radius:12px}.stat strong{display:block;font-size:1.3rem}@media(max-width:500px){.stats{grid-template-columns:1fr 1fr}}
.photo-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.photo-grid img{width:140px;height:110px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.photo-card{display:grid;gap:5px}.photo-card label{font-weight:normal;font-size:.85rem}.photo-card input{width:auto}
</style>
</head>
<body>
<header><h1>Woodshop Manager</h1><p>Orders · Projects · Costs · Inventory</p></header>
<main>
<nav id="nav">
<button class="active" data-tab="dashboard">Dashboard</button><button data-tab="orders">Orders</button><button data-tab="projects">Projects</button><button data-tab="costs">Costs</button><button data-tab="inventory">Inventory</button><button data-tab="backup">Backup</button>
</nav>
<div id="app"></div>
</main>
<script>
const KEY='woodshopManagerData_v2';
let data={orders:[],projects:[],costs:[],inventory:[]}, tab='dashboard', editId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Number(n)||0).toFixed(2);
function normalizeRecords(obj){const out={...data,...obj};['orders','projects','costs','inventory'].forEach(k=>{out[k]=(Array.isArray(out[k])?out[k]:[]).map(r=>({...r,id:(r.id===undefined||r.id===null||r.id==='')?id():String(r.id)}));});return out;}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){data=normalizeRecords(JSON.parse(raw));save();}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function setTab(t){tab=t;editId=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)setTab(b.dataset.tab)});
function field(label,name,value='',type='text',placeholder=''){return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`}
function selectField(label,name,options,value=''){return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function textArea(label,name,value=''){return `<div class="field"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" rows="2">${esc(value)}</textarea></div>`}
function formWrap(title,kind,body){return `<section class="panel"><h2>${title}</h2><form id="recordForm" data-kind="${kind}">${body}<div class="actions"><button type="submit">${editId?'Save Changes':'Save'}</button><button type="button" class="secondary" id="cancelEdit">Cancel</button></div></form></section>`}
function formValues(form){return Object.fromEntries(new FormData(form).entries())}
async function imageToDataUrl(file){
 if(!file.type.startsWith('image/'))throw new Error('Please choose an image file.');
 const img=await createImageBitmap(file);
 const scale=Math.min(1,1200/Math.max(img.width,img.height));
 const canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
 canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
 if(img.close)img.close();
 return canvas.toDataURL('image/jpeg',0.7);
}
function projectPhotosMarkup(x){
 const photos=Array.isArray(x?.photos)?x.photos:[];
 return `<div class="field"><label for="projectPhotos">Project photos (up to 3 total)</label>
 <input id="projectPhotos" type="file" accept="image/*" multiple>
 <p class="muted">Choose photos from your computer. Images are reduced in size to save space.</p>
 <div class="photo-grid">${photos.map((src,i)=>`<div class="photo-card"><img src="${src}" alt="Project photo ${i+1}"><label><input type="checkbox" name="removePhoto" value="${i}"> Remove this photo</label></div>`).join('')}</div></div>`;
}
function handleForm(){const f=$('#recordForm');if(!f)return;f.addEventListener('submit',async e=>{e.preventDefault();const kind=f.dataset.kind,v=formValues(f);
 if(kind==='projects'){
   const old=editId&&editId!=='__new__'?record(kind,editId):null;
   let photos=Array.isArray(old?.photos)?old.photos.slice():[];
   const remove=new Set([...f.querySelectorAll('[name="removePhoto"]:checked')].map(el=>Number(el.value)));
   photos=photos.filter((_,i)=>!remove.has(i));
   const files=[...f.querySelector('#projectPhotos').files];
   if(photos.length+files.length>3){alert('You can keep up to 3 photos per project. Remove an existing photo or choose fewer files.');return}
   try{for(const file of files)photos.push(await imageToDataUrl(file));}catch(err){alert('Could not add photo: '+err.message);return}
   v.photos=photos;
 }
if(kind==='inventory'){v.quantity=Number(v.quantity)||0;v.lowStock=Number(v.lowStock)||0}if(kind==='costs')v.amount=Number(v.amount)||0;if(kind==='orders'){v.price=Number(v.price)||0;v.deposit=Number(v.deposit)||0}const arr=data[kind];if(editId&&editId!=='__new__'){const i=arr.findIndex(x=>String(x.id)===String(editId));if(i>=0)arr[i]={...arr[i],...v};}else arr.unshift({id:id(),...v});try{save()}catch(err){alert('Could not save. Photo storage may be full. Try fewer or smaller photos. Your existing records should still be available.');return}editId=null;render()});$('#cancelEdit').addEventListener('click',()=>{editId=null;render()})}
function edit(kind,itemId){editId=itemId;render()}
function remove(kind,itemId){if(confirm('Delete this item?')){data[kind]=data[kind].filter(x=>String(x.id)!==String(itemId));save();render()}}
function record(kind,itemId){return data[kind].find(x=>String(x.id)===String(itemId))}
function inventoryForm(x={}){return formWrap(editId?'Edit Inventory Item':'Add Inventory Item','inventory',
`<div class="grid">${field('Item name','name',x.name||'')}${selectField('Category','category',['Lumber','Hardware','Finishing','Supplies','Tools','Other'],x.category||'Lumber')}${field('Quantity in stock','quantity',x.quantity??0,'number')}${selectField('Unit','unit',['Boards','Board feet','Pieces','Sheets','Feet','Inches','Pounds','Gallons','Bottles','Boxes','Other'],x.unit||'Boards')}${field('Low-stock alert at','lowStock',x.lowStock??0,'number')}${field('Storage location','location',x.location||'')}</div>${textArea('Notes','notes',x.notes||'')}`)}
function renderInventory(){const x=editId?record('inventory',editId):null;let html=x?inventoryForm(x):`<section class="panel"><div class="toolbar"><h2>Inventory</h2><button id="addRecord">+ Add Item</button></div><p class="muted">Quantity is shown for every item. Use Edit to update stock after buying or using material.</p>${data.inventory.length?`<div class="itemlist">${data.inventory.map(i=>`<div class="item"><div class="itemtop"><div><div class="itemname">${esc(i.name)}</div><div class="muted">${esc(i.category||'Other')}${i.location?' · '+esc(i.location):''}</div></div><span class="pill">${Number(i.quantity)||0} ${esc(i.unit||'units')} in stock</span></div>${Number(i.lowStock)>0&&Number(i.quantity)<=Number(i.lowStock)?'<div class="stock" style="color:#a33b32">Low stock</div>':''}${i.notes?`<p class="muted">${esc(i.notes)}</p>`:''}<div class="actions"><button class="small" data-edit="${i.id}">Edit Item</button><button class="small secondary" data-stock="${i.id}" data-delta="1">+ Add Stock</button><button class="small secondary" data-stock="${i.id}" data-delta="-1">− Use Stock</button><button class="small danger" data-delete="${i.id}">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No inventory items yet. Click Add Item to get started.</div>'}</section>`;
$('#app').innerHTML=html;
const add=$('#addRecord');if(add)add.onclick=()=>{editId=null;$('#app').innerHTML=inventoryForm();handleForm()};
const f=$('#recordForm');if(f)handleForm();
$('#app').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit('inventory',b.dataset.edit));
$('#app').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove('inventory',b.dataset.delete));
$('#app').querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{const i=record('inventory',b.dataset.stock);const action=b.dataset.delta==='1'?'add':'use';const raw=prompt(action==='add'?'How many units are you adding?':'How many units are you using?', '1');if(raw===null)return;const n=Number(raw);if(!Number.isFinite(n)||n<=0){alert('Enter a number greater than zero.');return}if(action==='use'&&n>Number(i.quantity)){if(!confirm('That is more than the current stock. Use it anyway?'))return}i.quantity=Number(i.quantity||0)+(action==='add'?n:-n);save();renderInventory()});
}
function renderGeneric(kind,title){const configs={
orders:{name:'Item ordered',category:'Status',opts:['New','In Progress','Completed','Picked Up'],extra:`<div class="grid">${field('Customer name','customer')}${field('Phone (optional)','phone')}${field('Due date','dueDate','','date')}${field('Selling price ($)','price','0','number')}${field('Deposit ($)','deposit','0','number')}${selectField('Status','status',['New','In Progress','Completed','Picked Up'],'New')}</div>${textArea('Notes','notes')}`,list:i=>`<strong>${esc(i.item||'Order')}</strong> — ${esc(i.customer||'No customer')}<br>${money(i.price)} price · ${money(Math.max(0,(Number(i.price)||0)-(Number(i.deposit)||0)))} balance · ${esc(i.status||'New')}`},
projects:{extra:`<div class="grid">${field('Project name','name')}${field('Dimensions','dimensions')}${field('Wood species','wood')}${field('Estimated cost ($)','estimatedCost','0','number')}</div>${textArea('CNC / toolpath notes','cncNotes')}${textArea('Other notes','notes')}`,list:i=>`<strong>${esc(i.name)}</strong><br>${esc(i.dimensions||'')}${i.wood?' · '+esc(i.wood):''}${Array.isArray(i.photos)&&i.photos.length?`<div class="photo-grid">${i.photos.map((src,j)=>`<img src="${src}" alt="Photo ${j+1} of ${esc(i.name)}">`).join('')}</div>`:''}`},
costs:{extra:`<div class="grid">${field('Description','description')}${selectField('Category','category',['Materials','Hardware','Finishing','Tools','Shipping','Fees','Other'],'Materials')}${field('Date','date',new Date().toISOString().slice(0,10),'date')}${field('Amount ($)','amount','0','number')}</div>${textArea('Notes','notes')}`,list:i=>`<strong>${esc(i.description)}</strong> — ${money(i.amount)}<br>${esc(i.category||'Other')} · ${esc(i.date||'')}`}
};const c=configs[kind];const isNew=editId==='__new__';const x=editId&&!isNew?record(kind,editId):null;let extra=c.extra||c.extra;let body=extra;
if(kind==='orders'){body=`<div class="grid">${field('Customer name','customer',x?.customer||'')}${field('Phone (optional)','phone',x?.phone||'')}${field('Item ordered','item',x?.item||'')}${field('Due date','dueDate',x?.dueDate||'','date')}${field('Selling price ($)','price',x?.price??0,'number')}${field('Deposit ($)','deposit',x?.deposit??0,'number')}${selectField('Status','status',['New','In Progress','Completed','Picked Up'],x?.status||'New')}</div>${textArea('Notes','notes',x?.notes||'')}`}
if(kind==='projects')body=`<div class="grid">${field('Project name','name',x?.name||'')}${field('Dimensions','dimensions',x?.dimensions||'')}${field('Wood species','wood',x?.wood||'')}${field('Estimated cost ($)','estimatedCost',x?.estimatedCost??0,'number')}</div>${textArea('CNC / toolpath notes','cncNotes',x?.cncNotes||'')}${textArea('Other notes','notes',x?.notes||'')}${projectPhotosMarkup(x)}`;
if(kind==='costs')body=`<div class="grid">${field('Description','description',x?.description||'')}${selectField('Category','category',['Materials','Hardware','Finishing','Tools','Shipping','Fees','Other'],x?.category||'Materials')}${field('Date','date',x?.date||new Date().toISOString().slice(0,10),'date')}${field('Amount ($)','amount',x?.amount??0,'number')}</div>${textArea('Notes','notes',x?.notes||'')}`;
let html=(x||isNew)?formWrap(x?'Edit '+title.slice(0,-1):'Add '+title.slice(0,-1),kind,body):`<section class="panel"><div class="toolbar"><h2>${title}</h2><button id="addRecord">+ Add ${kind==='orders'?'Order':kind==='projects'?'Project':'Cost'}</button></div>${data[kind].length?`<div class="itemlist">${data[kind].map(i=>`<div class="item">${c.list(i)}<div class="actions"><button class="small" data-edit="${i.id}">Edit</button><button class="small danger" data-delete="${i.id}">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No records yet.</div>'}</section>`;
$('#app').innerHTML=html;const add=$('#addRecord');if(add)add.onclick=()=>{editId='__new__';renderGeneric(kind,title)};const f=$('#recordForm');if(f)handleForm();$('#app').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(kind,b.dataset.edit));$('#app').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(kind,b.dataset.delete))
}
function renderBackup(){ $('#app').innerHTML=`<section class="panel"><h2>Backup & Restore</h2><p>Save a copy of your records regularly. Project photos are included in JSON backups, so backup files may be larger.</p><div class="actions"><button id="exportJson">Download Backup (JSON)</button><button id="exportCsv" class="secondary">Export Inventory (CSV)</button><label class="button secondary" for="importFile">Restore Backup</label><input id="importFile" type="file" accept=".json,application/json" class="hidden"></div><p class="muted">Restoring replaces the records currently in this app. Export a fresh backup first if you have added anything since your last backup.</p><div class="notice">This local app stores records in this browser on this computer. A backup file is the safest way to move or protect your data.</div></section>`;
$('#exportJson').onclick=()=>download('woodshop-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');
$('#exportCsv').onclick=()=>{const rows=[['Item','Category','Quantity','Unit','Low stock','Location','Notes'],...data.inventory.map(i=>[i.name,i.category,i.quantity,i.unit,i.lowStock,i.location,i.notes])];download('woodshop-inventory.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')};
$('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.orders)||!Array.isArray(parsed.inventory))throw new Error('That file does not look like a Woodshop Manager backup.');if(!confirm('Restore this backup? Current records in this app will be replaced.'))return;data=normalizeRecords({orders:parsed.orders||[],projects:parsed.projects||[],costs:parsed.costs||[],inventory:parsed.inventory||[]});save();alert('Backup restored.');render()}catch(err){alert(err.message||'Could not read that backup file.')}}}
function download(name,content,type){const a=document.createElement('a');const u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function render(){if(tab==='inventory')return renderInventory();if(tab==='orders')return renderGeneric('orders','Orders');if(tab==='projects')return renderGeneric('projects','Projects');if(tab==='costs')return renderGeneric('costs','Costs');if(tab==='backup')return renderBackup();$('#app').innerHTML=`<section class="panel"><h2>Shop Dashboard</h2><div class="stats"><div class="stat"><span class="muted">Orders</span><strong>${data.orders.length}</strong></div><div class="stat"><span class="muted">Projects</span><strong>${data.projects.length}</strong></div><div class="stat"><span class="muted">Expenses</span><strong>${money(data.costs.reduce((s,c)=>s+(Number(c.amount)||0),0))}</strong></div><div class="stat"><span class="muted">Inventory items</span><strong>${data.inventory.length}</strong></div><div class="stat"><span class="muted">Orders balance due</span><strong>${money(data.orders.reduce((s,o)=>s+Math.max(0,(Number(o.price)||0)-(Number(o.deposit)||0)),0))}</strong></div></div></section><section class="panel"><h2>Quick Start</h2><p>Use the tabs above to manage orders, projects, expenses, and stock.</p><p class="muted">Tip: Open Backup regularly and download a copy of your records.</p></section>`}
load();render();
</script>
</body>
</html>
